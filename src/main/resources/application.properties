spring.application.name=hospital-familia-server
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospital_familia_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hospital_familia_dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hospital_familia_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:hospitalFamiliaLocalDevelopmentSecretKeyMustBeAtLeastThirtyTwoBytesLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8100,http://localhost:4200}
app.docs.enabled=${APP_DOCS_ENABLED:false}
app.demo.seed-enabled=${APP_DEMO_SEED_ENABLED:false}
app.password-reset.expose-token=${APP_PASSWORD_RESET_EXPOSE_TOKEN:false}
app.password-reset.expiration-minutes=${APP_PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.password-reset.delivery-enabled=${APP_PASSWORD_RESET_DELIVERY_ENABLED:false}
app.password-reset.from=${APP_PASSWORD_RESET_FROM:no-reply@hospitalfamilia.local}
app.password-reset.reset-url=${APP_PASSWORD_RESET_URL:http://localhost:8100/auth/reset-password}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${APP_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${APP_DOCS_ENABLED:false}
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
