spring.application.name=hospital-familia-server
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospital_familia_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hospital_familia_dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hospital_familia_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:hospitalFamiliaLocalDevelopmentSecretKeyMustBeAtLeastThirtyTwoBytesLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
