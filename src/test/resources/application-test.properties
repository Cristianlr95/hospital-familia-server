spring.datasource.url=jdbc:h2:mem:hospital_familia_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.jwt.secret=hospitalFamiliaTestSecretKeyMustBeAtLeastThirtyTwoBytesLong
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.cors.allowed-origins=http://localhost:8100,http://localhost:4200
app.docs.enabled=true
app.password-reset.expose-token=true
app.password-reset.expiration-minutes=30
